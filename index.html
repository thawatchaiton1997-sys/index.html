<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0d1730" />
  <title>FactoryPulse - OEE & Production Tracker</title>
  <style>
    :root {
      --bg: #070d1d; --panel: #0d1730; --card: #122042; --card-2: #091124;
      --hero: linear-gradient(135deg, #27488a 0%, #3560b8 100%);
      --text: #f8fafc; --muted: #93a4c3; --accent: #38bdf8;
      --accent-green: #22c55e; --danger: #ef4444; --border: rgba(148, 163, 184, 0.18);
      --sidebar-w: 260px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at top right, #13254c 0%, var(--bg) 55%);
      color: var(--text); min-height: 100vh;
    }

    /* Login Box */
    .login-wrap { padding: 16px; }
    .login-box {
      max-width: 400px; margin: 56px auto; background: var(--panel);
      border: 1px solid var(--border); border-radius: 16px; padding: 24px;
    }
    .pass-wrap { position: relative; display: flex; align-items: center; }
    .pass-wrap input { padding-right: 65px; }
    .toggle-pass {
      position: absolute; right: 8px; background: #1e293b; color: var(--muted);
      border: 1px solid var(--border); padding: 4px 8px; font-size: 0.75rem; border-radius: 6px;
    }

    /* App Layout with Left Sidebar */
    .app-layout {
      display: flex;
      min-height: 100vh;
    }
    .sidebar {
      width: var(--sidebar-w);
      background: rgba(13, 23, 48, 0.96);
      border-right: 1px solid var(--border);
      padding: 18px 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: sticky;
      top: 0;
      height: 100vh;
      flex-shrink: 0;
      z-index: 40;
      transition: transform 0.25s ease;
    }
    .sidebar-brand {
      padding: 4px 8px 14px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 14px;
    }
    .sidebar-logo {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .logo-badge {
      width: 28px; height: 28px; border-radius: 8px;
      background: var(--hero);
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 0.85rem; font-weight: 800; color: #fff;
      border: 1px solid rgba(56, 189, 248, 0.4);
    }
    .sidebar-sub {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 4px;
    }
    .nav-group-label {
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      font-weight: 700;
      padding: 6px 10px;
      margin-top: 4px;
    }
    .nav-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .nav-item {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
      text-align: left;
      background: transparent;
      color: var(--muted);
      border: 1px solid transparent;
      border-radius: 10px;
      padding: 10px 12px;
      font-weight: 600;
      font-size: 0.86rem;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .nav-item:hover {
      background: rgba(56, 189, 248, 0.08);
      color: var(--text);
    }
    .nav-item.active {
      background: var(--hero);
      color: var(--text);
      border-color: rgba(56, 189, 248, 0.45);
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.45);
    }
    .nav-icon {
      font-size: 1rem;
      width: 20px;
      text-align: center;
      flex-shrink: 0;
    }
    .nav-text {
      display: flex;
      flex-direction: column;
      line-height: 1.25;
    }
    .nav-desc {
      font-size: 0.7rem;
      font-weight: 400;
      opacity: 0.8;
    }
    .sidebar-footer {
      border-top: 1px solid var(--border);
      padding-top: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .sidebar-user-card {
      background: var(--card-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 0.82rem;
    }
    .sidebar-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(2, 6, 23, 0.65);
      z-index: 35;
    }
    .sidebar-backdrop.show { display: block; }

    .main-area {
      flex: 1;
      min-width: 0;
      padding: 16px 20px;
    }
    .container { max-width: 1240px; margin: 0 auto; }

    .topbar {
      display: flex; justify-content: space-between; align-items: center;
      gap: 12px; flex-wrap: wrap; margin-bottom: 14px;
    }
    .topbar-left { display: flex; align-items: center; gap: 10px; }
    .menu-toggle-btn {
      display: none;
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 11px;
      border-radius: 10px;
      font-size: 1rem;
    }
    .brand-title { font-size: 1.28rem; font-weight: 700; margin: 0; }
    .brand-sub { color: var(--muted); font-size: 0.83rem; margin-top: 2px; }
    .live-pill {
      display: inline-flex; align-items: center; gap: 6px; font-size: 0.75rem;
      color: #86efac; background: rgba(34, 197, 94, 0.12); border: 1px solid rgba(34, 197, 94, 0.35);
      padding: 6px 10px; border-radius: 999px;
    }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent-green); }

    @media (max-width: 920px) {
      .sidebar {
        position: fixed;
        left: 0; top: 0; bottom: 0;
        transform: translateX(-100%);
      }
      .sidebar.open {
        transform: translateX(0);
      }
      .menu-toggle-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      .main-area { padding: 14px; }
    }

    .filter-bar {
      display: flex; gap: 10px; flex-wrap: wrap; align-items: end; background: var(--panel);
      border: 1px solid var(--border); border-radius: 14px; padding: 12px 14px; margin-bottom: 14px;
    }
    .filter-item { min-width: 150px; flex: 1; }
    .oee-showcase { display: grid; grid-template-columns: 1.15fr 1.85fr; gap: 12px; margin-bottom: 16px; }
    @media (max-width: 820px) { .oee-showcase { grid-template-columns: 1fr; } }
    .oee-hero {
      background: var(--hero); border-radius: 16px; padding: 20px; display: flex;
      flex-direction: column; justify-content: space-between; min-height: 210px;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
    .hero-top { display: flex; justify-content: space-between; align-items: center; }
    .hero-label { font-size: 0.8rem; letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.9; font-weight: 600; }
    .hero-scope { font-size: 0.8rem; background: rgba(9, 17, 36, 0.35); padding: 4px 10px; border-radius: 999px; }
    .hero-val { font-size: clamp(2.8rem, 6vw, 4.2rem); font-weight: 800; line-height: 1.05; margin: 12px 0; }
    .hero-foot { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; font-size: 0.85rem; opacity: 0.92; }
    .sub-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    @media (max-width: 640px) { .sub-grid { grid-template-columns: 1fr; } }
    .kpi-grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 16px; }
    @media (max-width: 960px) { .kpi-grid-4 { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 560px) { .kpi-grid-4 { grid-template-columns: 1fr; } }
    .metric-card {
      background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
      padding: 14px 16px; display: flex; flex-direction: column; justify-content: space-between;
    }
    .metric-title { font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
    .metric-val { font-size: 1.75rem; font-weight: 800; margin: 8px 0 4px; color: #4ade80; }
    .metric-val.sky { color: var(--accent); }
    .metric-val.light { color: var(--text); }
    .metric-sub { font-size: 0.78rem; color: var(--muted); }
    .card { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 16px; margin-bottom: 16px; }
    .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; margin-bottom: 12px; }
    .grid-4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 12px; }
    .preset-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; font-size: 0.82rem; color: var(--muted); }
    label { display: block; font-size: 0.78rem; color: var(--muted); margin-bottom: 4px; }
    input, select {
      width: 100%; padding: 8px 9px; border-radius: 8px; border: 1px solid var(--border);
      background: var(--card-2); color: var(--text); font-size: 0.9rem;
    }
    input[type="number"]::-webkit-outer-spin-button,
    input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    input[type="number"] { -moz-appearance: textfield; appearance: textfield; }
    .batch-table input, .batch-table select { padding: 6px 8px; font-size: 0.85rem; min-width: 72px; }
    .mc-cell { display: flex; gap: 4px; align-items: center; min-width: 150px; }
    .batch-table select.mc-select { min-width: 74px; padding: 6px 4px; }
    .batch-table input.mc-input { min-width: 72px; text-transform: uppercase; }
    .batch-table input.num-input { min-width: 64px; text-align: right; }
    .batch-table select.status-input { min-width: 165px; }
    .batch-table input.reason-input { min-width: 135px; }
    button {
      background: var(--accent); color: #041827; border: none; border-radius: 8px;
      padding: 9px 15px; font-weight: 700; cursor: pointer; font-size: 0.9rem;
    }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    button.secondary { background: #1e293b; color: var(--text); border: 1px solid var(--border); }
    button.small { padding: 6px 10px; font-size: 0.8rem; }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
    .msg { margin-top: 12px; padding: 10px 12px; border-radius: 8px; font-size: 0.88rem; display: none; }
    .msg.ok { display: block; background: rgba(34, 197, 94, 0.15); border: 1px solid var(--accent-green); color: #86efac; }
    .msg.err { display: block; background: rgba(239, 68, 68, 0.15); border: 1px solid var(--danger); color: #fca5a5; }
    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    th, td { border-bottom: 1px solid var(--border); padding: 8px 6px; text-align: left; white-space: nowrap; }
    th { color: var(--muted); font-weight: 600; }
    .badge-planned {
      display: inline-block; padding: 2px 7px; border-radius: 6px; font-size: 0.75rem;
      background: rgba(245, 158, 11, 0.16); border: 1px solid rgba(245, 158, 11, 0.4); color: #fcd34d;
    }
    .badge-ok {
      display: inline-block; padding: 2px 7px; border-radius: 6px; font-size: 0.75rem;
      background: rgba(34, 197, 94, 0.15); border: 1px solid rgba(34, 197, 94, 0.4); color: #86efac;
    }
    .badge-low {
      display: inline
